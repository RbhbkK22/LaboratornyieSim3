spring.application.name=parking-app
server.port=8080

# база H2 в файле, чтобы данные не пропадали после перезапуска
# AUTO_SERVER=TRUE - чтобы файл не блокировался, если базу открыл еще какой-то процесс (IDE, второй запуск)
spring.datasource.url=jdbc:h2:file:./data/parking;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false

# actuator
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=Parking
info.app.description=Учет автомобилей на парковке
info.app.version=0.0.1
