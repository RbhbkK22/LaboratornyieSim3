<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Роли')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container" style="max-width: 800px">
    <h3>Управление ролями пользователей</h3>
    <p class="text-muted">Новая роль начнет действовать после повторного входа пользователя.</p>

    <div th:replace="~{fragments/header :: messages}"></div>

    <div class="card shadow-sm">
        <table class="table mb-0">
            <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Логин</th>
                <th>Текущая роль</th>
                <th>Назначить роль</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.username}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${u.role.name() == 'ADMIN'} ? 'bg-danger' : (${u.role.name() == 'USER'} ? 'bg-primary' : 'bg-secondary')"
                          th:text="${u.role}"></span>
                </td>
                <td>
                    <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post" class="d-flex gap-2">
                        <select name="role" class="form-select form-select-sm" style="width: 150px">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"
                                    th:selected="${r == u.role}"></option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-primary">Сохранить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<th:block th:replace="~{fragments/header :: scripts}"></th:block>
</body>
</html>
