<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Модель')}"></head>
<body>
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container" style="max-width: 600px">
    <h3 th:text="${carModel.id == null} ? 'Новая модель' : 'Редактирование модели'"></h3>

    <div class="card shadow-sm p-4">
        <form th:action="@{/models/save}" th:object="${carModel}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Марка</label>
                <input type="text" th:field="*{brand}" class="form-control" placeholder="Toyota">
                <div class="text-danger small" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Модель</label>
                <input type="text" th:field="*{modelName}" class="form-control" placeholder="Camry">
                <div class="text-danger small" th:if="${#fields.hasErrors('modelName')}" th:errors="*{modelName}"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Год выпуска</label>
                    <input type="number" th:field="*{releaseYear}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('releaseYear')}" th:errors="*{releaseYear}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Стоимость, ₽</label>
                    <input type="number" step="0.01" th:field="*{price}" class="form-control">
                    <div class="text-danger small" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a th:href="@{/models}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>

<th:block th:replace="~{fragments/header :: scripts}"></th:block>
</body>
</html>
