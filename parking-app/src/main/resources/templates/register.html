<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Регистрация')}"></head>
<body>
<div class="container">
    <div class="login-box card shadow-sm p-4">
        <h3 class="text-center mb-3">Регистрация</h3>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <label class="form-label">Логин</label>
                <input type="text" name="username" class="form-control" th:value="${param.username}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Повторите пароль</label>
                <input type="password" name="confirmPassword" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
        </form>
        <p class="text-muted small mt-3 mb-0">
            После регистрации у вас будет роль READ_ONLY (только просмотр).
            Чтобы получить больше прав, обратитесь к администратору.
        </p>
        <p class="text-center mt-2 mb-0"><a th:href="@{/login}">Назад ко входу</a></p>
    </div>
</div>
</body>
</html>
