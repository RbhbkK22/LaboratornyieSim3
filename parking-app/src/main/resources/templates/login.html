<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Вход')}"></head>
<body>
<div class="container">
    <div class="login-box card shadow-sm p-4">
        <h3 class="text-center mb-3">Вход в систему</h3>

        <div class="alert alert-danger" th:if="${param.error}">Неверный логин или пароль</div>
        <div class="alert alert-info" th:if="${param.logout}">Вы вышли из системы</div>
        <div class="alert alert-success" th:if="${param.registered}">Регистрация прошла успешно, войдите</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Логин</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
        <p class="text-center mt-3 mb-0">
            Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a>
        </p>
    </div>
</div>
</body>
</html>
