spring.application.name=lab7
spring.jpa.open-in-view=false
spring.datasource.url=jdbc:h2:./testdb/students
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.jackson.deserialization.fail-on-null-for-primitives=false
management.endpoints.web.exposure.include=health,info,metrics,beans,env,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=lab7
info.app.description=Web application with students and study groups
